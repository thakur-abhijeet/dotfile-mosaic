# ╔══════════════════════════════════════════╗
# ║         Hyprlock — hyprlock.conf         ║
# ╚══════════════════════════════════════════╝
# Docs: https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/

source = ~/.config/hyprlock/colors.conf

# =============================================================================
# General
# =============================================================================
general {
    immediate_render = true     # replaces deprecated disable_loading
    hide_cursor      = true
    grace            = 2        # seconds before lock engages
    no_fade_in       = false
}

# =============================================================================
# Background
# =============================================================================
background {
    monitor =
    path   = screenshot         # blurs your current screen

    # Fallback solid color if screenshot fails
    color  = $bg

    # Blur
    blur_passes = 3
    blur_size   = 7

    # Post-processing
    noise             = 0.0117
    contrast          = 0.8916
    brightness        = 0.8172
    vibrancy          = 0.1696
    vibrancy_darkness = 0.0
}

# =============================================================================
# Time
# =============================================================================
label {
    monitor =
    text        = cmd[update:1000] echo "$(date +"%H:%M")"
    color       = $accent
    font_size   = 120
    font_family = JetBrains Mono Nerd Font ExtraBold

    position = 0, 120
    halign   = center
    valign   = center

    # Shadow for readability over blurred bg
    shadow_passes   = 2
    shadow_size     = 4
    shadow_color    = rgba(0, 0, 0, 0.5)
    shadow_boost    = 1.2
}

# =============================================================================
# Date
# =============================================================================
label {
    monitor =
    text        = cmd[update:60000] echo "$(date +"%A, %d %B")"
    color       = $accent
    font_size   = 22
    font_family = JetBrains Mono Nerd Font Medium

    position = 0, 20
    halign   = center
    valign   = center

    shadow_passes = 2
    shadow_size   = 3
    shadow_color  = rgba(0, 0, 0, 0.4)
    shadow_boost  = 1.2
}

# =============================================================================
# Greeting — Username
# =============================================================================
label {
    monitor =
    text        = Hi, Abhi !!!
    color       = $accent
    font_size   = 14
    font_family = JetBrains Mono Nerd Font Medium

    position = 0, -70
    halign   = center
    valign   = center

    shadow_passes = 1
    shadow_size   = 2
    shadow_color  = rgba(0, 0, 0, 0.3)
}

# =============================================================================
# Status Indicators (Top Right)
# =============================================================================

# Battery
label {
    monitor =
    text = cmd[update:1000] echo "󰁹 $(cat /sys/class/power_supply/BAT0/capacity)%"
    color = $text
    font_size = 14
    font_family = JetBrains Mono Nerd Font Medium
    position = -40, -40
    halign = right
    valign = top
}

# Keyboard Layout
label {
    monitor =
    text = cmd[update:1000] echo "󰌌 $(niri msg --json keyboard-layouts | jq -r '.names[.current_idx]')"
    color = $text
    font_size = 12
    font_family = JetBrains Mono Nerd Font
    position = -40, -70
    halign = right
    valign = top
}

# =============================================================================
# Password Input Field
# =============================================================================
input-field {
    monitor =
    size = 260, 55

    # Border
    outline_thickness = 2
    rounding          = 12

    # Colors — idle state
    outer_color = $accent
    inner_color = $bg
    font_color  = $text

    # Colors — feedback states
    check_color   = $accent
    fail_color    = $accent
    capslock_color = $accent

    # Fail message
    fail_text         = Nope. Try again.
    fail_transition   = 300                   # ms fade between states

    # Dots
    dots_size    = 0.2
    dots_spacing = 0.3
    dots_center  = true

    # Placeholder
    placeholder_text = <span font_style="italic">Waiting for you...</span>

    fade_on_empty = true
    hide_input    = false

    position = 0, -130
    halign   = center
    valign   = center
}
