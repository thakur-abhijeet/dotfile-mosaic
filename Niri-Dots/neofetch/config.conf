# ╔══════════════════════════════════════════╗
# ║         Neofetch — config.conf           ║
# ╚══════════════════════════════════════════╝
source ${HOME}/.config/neofetch/colors.conf


# =============================================================================
# Info Display
# =============================================================================
print_info() {
    info " " kernel
    info "󱎫 " uptime
    info "󰏖 " packages
    info "󰖲 " wm
    info "󰆍 " shell
    info " " cpu
    info "󰍛 " memory
    prin "$(color 4)──────────────────$(color)"
    info cols
}

# =============================================================================
# Kernel / OS
# =============================================================================
kernel_shorthand="on" # show only kernel version, not full uname string
distro_shorthand="off"
os_arch="off"

# =============================================================================
# Uptime
# =============================================================================
uptime_shorthand="on" # "2 hours" not "2 hours, 3 minutes"

# =============================================================================
# Packages
# =============================================================================
package_managers="on"

# =============================================================================
# Shell
# =============================================================================
shell_path="off"   # just the name — /usr/bin/fish is noisy
shell_version="on" # version is useful

# =============================================================================
# CPU
# =============================================================================
cpu_brand="on"
cpu_speed="off"     # clutter
cpu_cores="logical" # show logical core count
cpu_temp="off"      # unreliable across machines

# =============================================================================
# Memory
# =============================================================================
memory_percent="on" # e.g. "4GiB / 16GiB (25%)"
memory_unit="gib"   # GiB reads cleaner than MiB for modern RAM

# =============================================================================
# Visual — Text
# =============================================================================
separator=" •"
bold="on"
underline_enabled="on"
underline_char="─"

# ================= ============================================================
# Visual — Color blocks
# =============================================================================
colors=(4 7 7 4)
color_blocks="on"
block_width=3
block_height=1
block_range=(0 7)
col_offset="auto"

# =============================================================================
# ASCII Art
# =============================================================================
image_backend="ascii"
image_source="${HOME}/.config/neofetch/alien.txt"

# Distro-aware ascii — auto detects on both machines
ascii_distro="auto"
ascii_colors=(4)
ascii_bold="on"

# =============================================================================
# Bars (off — keeping it clean)
# =============================================================================
bar_char_elapsed="-"
bar_char_total="="
bar_border="on"
bar_length=15
bar_color_elapsed="distro"
bar_color_total="distro"
cpu_display="off"
memory_display="off"
battery_display="off"
disk_display="off"

# =============================================================================
# Misc
# =============================================================================
refresh_rate="off"
de_version="off" # not relevant — you use WMs not DEs
stdout="off"
