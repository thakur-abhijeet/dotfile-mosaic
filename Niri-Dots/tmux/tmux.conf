# ╔══════════════════════════════════════════╗
# ║         Tmux — tmux.conf                 ║
# ║         Abhijeet · TokyoNight            ║
# ╚══════════════════════════════════════════╝

# =============================================================================
# Core
# =============================================================================
set -g prefix C-Space
unbind C-b
bind-key C-Space send-prefix

set -g base-index 1              # start windows at 1
set -g pane-base-index 1         # start panes at 1
set -g detach-on-destroy off     # don't exit tmux when closing a session
set -g escape-time 0             # no escape delay (important for nvim)
set -g history-limit 1000000     # large scrollback
set -g renumber-windows on       # renumber windows on close
set -g set-clipboard on          # use system clipboard
set -g mouse on                  # mouse support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"  # true color support
set -g status-position bottom

# =============================================================================
# Key Bindings — Core
# =============================================================================

# Reload config
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Splits — open in current path
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Pane resize
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# Zoom toggle
bind -r m resize-pane -Z

# Session switcher
bind-key -r f run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"

# =============================================================================
# Key Bindings — Vi Copy Mode
# =============================================================================
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle  # block select
unbind -T copy-mode-vi MouseDragEnd1Pane

# =============================================================================
# Quick Launch Windows  (Alt + key, no prefix needed)
# =============================================================================
bind -n M-m new-window -n "monitor" btop
bind -n M-g new-window -c "#{pane_current_path}" -n "git"    lazygit
bind -n M-s new-window -c "#{pane_current_path}" -n "shell"  fish
bind -n M-f new-window -c "#{pane_current_path}" -n "files"  yazi
bind -n M-e new-window -c "#{pane_current_path}" -n "editor" "nvim ."
bind -n M-c new-window -c "#{pane_current_path}" -n "calc"   kalker

# =============================================================================
# Vim-Tmux Navigation  (seamless C-hjkl across nvim splits + tmux panes)
# =============================================================================
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'

if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# =============================================================================
# Plugins  (TPM)
# Bootstrap TPM if not installed
# =============================================================================
if "test ! -d ~/.tmux/plugins/tpm" \
    "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm \
    && ~/.tmux/plugins/tpm/bin/install_plugins'"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect / Continuum config
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# =============================================================================
# Online status config
# =============================================================================
set -g @online_icon  "󰖩 "
set -g @offline_icon "󰖪 "

# =============================================================================
# Status Bar — 90's Monochrome Pastel
# =============================================================================
set -g status-style          "bg=#1e1e1e"
set -g status-justify        "absolute-centre"
set -g status-left-length    100
set -g status-right-length   100

# ── Left ──────────────────────────────────────────────────────────────────────
set -g  status-left ""
# Session name — lavender bg when prefix active, dim lavender otherwise
set -ga status-left "#{?client_prefix,\
#{#[bg=#b4befe,fg=#1e1e1e,bold]  #S },\
#{#[bg=#1e1e1e,fg=#b4befe]  #S }}"
# Separator
set -ga status-left "#[bg=#1e1e1e,fg=#45475a]│"
# Current command
set -ga status-left "#[bg=#1e1e1e,fg=#bac2de]  #{pane_current_command} "
# Zoom indicator
set -ga status-left "#[bg=#1e1e1e,fg=#45475a]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#1e1e1e,fg=#f9e2af]#{?window_zoomed_flag,  zoom ,}"

# ── Right ─────────────────────────────────────────────────────────────────────
set -g  status-right ""
# Battery (if tmux-battery installed)
set -ga status-right "#[bg=#1e1e1e,fg=#a6e3a1]#{battery_icon} #{battery_percentage} "
set -ga status-right "#[bg=#1e1e1e,fg=#45475a]│"
# Online status
set -ga status-right "#[bg=#1e1e1e,fg=#94e2d5]#{online_status} "
set -ga status-right "#[bg=#1e1e1e,fg=#45475a]│"
# Time
set -ga status-right "#[bg=#1e1e1e,fg=#b4befe] 󰅐 %H:%M "
set -ga status-right "#[bg=#1e1e1e,fg=#45475a]│"
# Path (truncated)
set -ga status-right "#[bg=#1e1e1e,fg=#b4befe]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "

# =============================================================================
# Pane Borders
# =============================================================================
setw -g pane-border-status       off
setw -g pane-border-format       ""
setw -g pane-border-lines        single
setw -g pane-border-style        "bg=#1e1e1e,fg=#313244"
setw -g pane-active-border-style "bg=#1e1e1e,fg=#b4befe"  # lavender active pane

# =============================================================================
# Windows
# =============================================================================
set  -g automatic-rename-format  "Window"
set  -wg automatic-rename        on

set  -g window-status-format          " #I#{?#{!=:#{window_name},Window},: #W,} "
set  -g window-status-style           "bg=#1e1e1e,fg=#bac2de"
set  -g window-status-last-style      "bg=#1e1e1e,fg=#fab387"
set  -g window-status-activity-style  "bg=#f38ba8,fg=#1e1e1e"
set  -g window-status-bell-style      "bg=#f38ba8,fg=#1e1e1e,bold"
set  -gF window-status-separator      "#[bg=#1e1e1e,fg=#313244]│"

set  -g window-status-current-format  " #I#{?#{!=:#{window_name},Window},: #W,} "
set  -g window-status-current-style   "bg=#b4befe,fg=#1e1e1e,bold"

# =============================================================================
# TPM Init  (must be last)
# =============================================================================
run '~/.tmux/plugins/tpm/tpm'
